</script>

<script>
// ═══════════════════════════════════════════════════════════════════
//  SCREEN 5 — RISK FINDINGS
// ═══════════════════════════════════════════════════════════════════
async function renderFindings(el) {
  const findings = await api('/findings').catch(() => []);
  state.findings = findings;

  if (findings.length === 0) {
    el.innerHTML = `
      <div class="page-title mb-1">Risk Findings</div>
      <div class="page-sub mb-4">Normalised risk findings across all vendor assessments</div>
      <div class="card"><div class="empty-state">
        <div class="empty-icon">⚑</div>
        <div class="empty-title">No findings yet</div>
        <div class="empty-desc">Submit a vendor document for assessment to generate risk findings.</div>
        <button class="btn btn-primary mt-3" onclick="goto('upload')">Upload a document</button>
      </div></div>`;
    return;
  }

  const critN = findings.filter(f => f.severity === 'Critical').length;
  const highN  = findings.filter(f => f.severity === 'High').length;
  const medN   = findings.filter(f => f.severity === 'Medium').length;
  const lowN   = findings.filter(f => f.severity === 'Low').length;

  const cats = [...new Set(findings.map(f => f.risk_category))].sort();
  const vendors = [...new Set(findings.map(f => f.vendor_id))].sort();

  el.innerHTML = `
    <div class="page-title mb-1">Risk Findings</div>
    <div class="page-sub mb-4">${findings.length} finding${findings.length!==1?'s':''} across ${vendors.length} vendor${vendors.length!==1?'s':''}</div>

    <div class="stat-grid mb-4">
      <div class="stat-card accent-red">
        <div class="stat-label">Critical</div>
        <div class="stat-value">${critN}</div>
      </div>
      <div class="stat-card ${highN > 0 ? 'accent-red':''}">
        <div class="stat-label">High</div>
        <div class="stat-value">${highN}</div>
      </div>
      <div class="stat-card ${medN > 0 ? 'accent-amber':''}">
        <div class="stat-label">Medium</div>
        <div class="stat-value">${medN}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Low</div>
        <div class="stat-value">${lowN}</div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header" style="gap:10px">
        <div class="search-bar flex-1">
          <span>🔍</span>
          <input id="find-search" type="search" placeholder="Search findings…" oninput="filterFindings()" aria-label="Search findings">
        </div>
        <select class="form-input" style="width:140px" id="find-sev" onchange="filterFindings()" aria-label="Filter by severity">
          <option value="">All severities</option>
          <option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
        </select>
        <select class="form-input" style="width:160px" id="find-cat" onchange="filterFindings()" aria-label="Filter by category">
          <option value="">All categories</option>
          ${cats.map(c => `<option>${esc(c)}</option>`).join('')}
        </select>
        <select class="form-input" style="width:160px" id="find-vendor" onchange="filterFindings()" aria-label="Filter by vendor">
          <option value="">All vendors</option>
          ${vendors.map(v => `<option>${esc(v)}</option>`).join('')}
        </select>
      </div>
    </div>

    <div id="findings-list">
      ${findings.map((f,i) => buildFindingCard(f, `gl-${i}`)).join('')}
    </div>
  `;
}

function filterFindings() {
  const q   = document.getElementById('find-search')?.value.toLowerCase() || '';
  const sev = document.getElementById('find-sev')?.value || '';
  const cat = document.getElementById('find-cat')?.value || '';
  const ven = document.getElementById('find-vendor')?.value || '';
  // Re-render with filtered findings
  const filtered = state.findings.filter(f => {
    const text = `${f.title} ${f.description} ${f.risk_category} ${f.vendor_id} ${f.severity}`.toLowerCase();
    return (!q || text.includes(q))
        && (!sev || f.severity === sev)
        && (!cat || f.risk_category === cat)
        && (!ven || f.vendor_id === ven);
  });
  const list = document.getElementById('findings-list');
  if (!list) return;
  list.innerHTML = filtered.length
    ? filtered.map((f,i) => buildFindingCard(f, `filt-${i}`)).join('')
    : `<div class="empty-state" style="min-height:120px"><div class="empty-icon" style="font-size:28px">🔍</div><div class="empty-title">No matching findings</div></div>`;
}

// ═══════════════════════════════════════════════════════════════════
//  SCREEN 6 — WORKFLOW & APPROVALS
// ═══════════════════════════════════════════════════════════════════
async function renderWorkflow(el) {
  const assessments = await api('/assessments').catch(() => []);

  if (assessments.length === 0) {
    el.innerHTML = `
      <div class="page-title mb-1">Workflow & Approvals</div>
      <div class="page-sub mb-4">Assessment review and approval workflow</div>
      <div class="card"><div class="empty-state">
        <div class="empty-icon">⇄</div>
        <div class="empty-title">No assessments in workflow</div>
        <div class="empty-desc">Submit a vendor document to begin the review workflow.</div>
        <button class="btn btn-primary mt-3" onclick="goto('upload')">Upload a document</button>
      </div></div>`;
    return;
  }

  const WF_STATES = ['Draft','InReview','RemediationRequested','RemediationInProgress','Verified','Accepted','Rejected','Escalated'];
  const byStatus = {};
  WF_STATES.forEach(s => { byStatus[s] = []; });
  assessments.forEach(a => { (byStatus[a.workflow_status] = byStatus[a.workflow_status] || []).push(a); });

  const kanbanCols = [
    { key:'Draft',              label:'Draft',        color:'var(--text-muted)' },
    { key:'InReview',           label:'In Review',    color:'var(--blue)' },
    { key:'RemediationRequested',label:'Remediation', color:'var(--amber)' },
    { key:'Verified',           label:'Verified',     color:'var(--emerald-dark)' },
    { key:'Accepted',           label:'Accepted',     color:'var(--green)' },
    { key:'Escalated',          label:'Escalated',    color:'var(--red)' },
  ];

  const kanban = kanbanCols.map(col => {
    const items = (byStatus[col.key] || []);
    const cards = items.map(a => `
      <div class="card" style="padding:12px;margin-bottom:8px;cursor:pointer" onclick="openAssessmentWF('${esc(a.assessment_id)}')">
        <div class="font-bold truncate" style="font-size:13px">${esc(a.vendor_id)}</div>
        <div class="td-muted truncate text-xs">${esc(a.filename)}</div>
        <div class="flex gap-2 mt-2">
          ${sensitivityBadge(a.sensitivity)}
          ${a.high_critical > 0 ? `<span class="badge badge-red">${a.high_critical} H/C</span>` : ''}
        </div>
      </div>`).join('') || `<div class="text-xs text-muted" style="padding:8px">None</div>`;
    return `
      <div style="flex:1;min-width:160px;max-width:240px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:${col.color};margin-bottom:8px;padding:0 4px">
          ${esc(col.label)} <span style="font-weight:400;color:var(--text-muted)">(${items.length})</span>
        </div>
        ${cards}
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="page-title mb-1">Workflow & Approvals</div>
    <div class="page-sub mb-4">Assessment review, remediation tracking, and approval workflow</div>

    <div class="alert alert-navy mb-4">
      <span class="alert-icon">🔒</span>
      <span>Security enforcement is performed by the backend pipeline and Security Gate. Frontend workflow controls manage review status only. High and Critical findings require the approver to differ from the assessment creator — this is enforced server-side.</span>
    </div>

    <!-- State machine diagram -->
    <div class="card mb-6">
      <div class="card-header">
        <div class="card-title">Assessment State Machine</div>
        <div class="card-sub">Valid transitions are enforced by the backend WorkflowStateMachine</div>
      </div>
      <div class="card-body">
        <div class="workflow-track">
          ${['Draft','InReview','RemediationRequested','RemediationInProgress','Verified','Accepted'].map((s,i,arr) => `
            <div class="wf-node">
              <div class="wf-circle">${i+1}</div>
              <div class="wf-label">${esc(s)}</div>
            </div>${i<arr.length-1?'<div class="wf-arrow">→</div>':''}`).join('')}
          <div class="wf-arrow" style="margin-bottom:18px">↗</div>
          <div class="wf-node">
            <div class="wf-circle wf-alert">!</div>
            <div class="wf-label">Escalated</div>
          </div>
        </div>
        <div class="flex gap-2 mt-3 flex-wrap">
          <span class="badge badge-gray">Any → Escalated possible from InReview, RemediationRequested, Verified</span>
          <span class="badge badge-green">Escalated → Accepted or Rejected</span>
        </div>
      </div>
    </div>

    <!-- Kanban view -->
    <div class="card mb-6">
      <div class="card-header">
        <div class="card-title">Assessment Board</div>
        <div class="card-sub">Click an assessment to review and transition it</div>
      </div>
      <div class="card-body">
        <div style="display:flex;gap:16px;overflow-x:auto;padding-bottom:4px">${kanban}</div>
      </div>
    </div>

    <!-- All assessments table -->
    <div class="card">
      <div class="card-header"><div class="card-title">All Assessments</div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Vendor</th><th>Status</th><th>Severity</th><th>Findings</th><th>Gate</th><th>Actions</th></tr></thead>
          <tbody>
            ${assessments.map(a => `
              <tr>
                <td>
                  <div class="font-bold">${esc(a.vendor_id)}</div>
                  <div class="td-muted text-xs">${esc(a.filename)}</div>
                </td>
                <td>${statusBadge(a.workflow_status)}</td>
                <td>${sensitivityBadge(a.sensitivity)}</td>
                <td>${a.high_critical > 0 ? `<span class="badge badge-red">${a.high_critical} H/C</span>` : ''} <span class="td-muted">${a.finding_count} total</span></td>
                <td><span class="badge ${a.gate_passed ? 'badge-emerald':'badge-red'}">${a.gate_passed ? '✓':'✗'}</span></td>
                <td id="wf-actions-${esc(a.assessment_id)}">
                  ${buildWFButtons(a)}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function buildWFButtons(a) {
  const map = {
    Draft: [['InReview','Submit','btn-primary btn-sm']],
    InReview: [['Verified','Verify','btn-primary btn-sm'],['RemediationRequested','Request Remediation','btn-secondary btn-sm'],['Escalated','Escalate','btn-danger btn-sm']],
    RemediationRequested: [['RemediationInProgress','Start','btn-secondary btn-sm']],
    RemediationInProgress: [['Verified','Verify','btn-primary btn-sm']],
    Verified: [['Accepted','Accept','btn-primary btn-sm'],['Rejected','Reject','btn-danger btn-sm']],
    Escalated: [['Accepted','Accept','btn-primary btn-sm'],['Rejected','Reject','btn-danger btn-sm']],
  };
  return (map[a.workflow_status] || []).map(([to, label, cls]) =>
    `<button class="btn ${cls}" onclick="quickTransition('${esc(a.assessment_id)}','${esc(to)}',this)">${esc(label)}</button>`
  ).join(' ');
}

async function quickTransition(id, to, btn) {
  btn.disabled = true;
  try {
    await api(`/assessments/${id}/transition`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ to_status:to, actor_id:'reviewer', reason:`Transitioned to ${to}` }),
    });
    toast(`Moved to ${to}`, 'success');
    await renderWorkflow(document.getElementById('page-content'));
  } catch(e) {
    toast(e.message, 'error');
    btn.disabled = false;
  }
}

async function openAssessmentWF(id) {
  goto('assessments');
  await new Promise(r => setTimeout(r, 200));
  await openAssessmentDetail(id);
}

</script>

<script>
// ═══════════════════════════════════════════════════════════════════
//  SCREEN 7 — AUDIT TRAIL
// ═══════════════════════════════════════════════════════════════════
async function renderAudit(el) {
  const events = await api('/audit').catch(() => []);
  state.auditEvents = events;

  if (events.length === 0) {
    el.innerHTML = `
      <div class="page-title mb-1">Audit Trail</div>
      <div class="page-sub mb-4">Hash-chained, append-only pipeline audit log</div>
      <div class="card"><div class="empty-state">
        <div class="empty-icon">≡</div>
        <div class="empty-title">No audit events yet</div>
        <div class="empty-desc">Pipeline activity will appear here once assessments are submitted.</div>
      </div></div>`;
    return;
  }

  const stages = [...new Set(events.map(e => e.stage))].sort();
  const actions = [...new Set(events.map(e => e.action))].sort();

  function renderAuditList(evts) {
    return evts.map((e, i, arr) => `
      <div class="audit-row">
        <div class="audit-dot-col">
          <div class="audit-dot-outer" style="border-color:${auditColor(e.stage)};background:${auditBg(e.stage)}"></div>
          ${i < arr.length-1 ? '<div class="audit-line"></div>' : ''}
        </div>
        <div class="audit-content flex-1">
          <div class="audit-action">${stageBadge(e.stage)} ${actionBadge(e.action)}</div>
          <div class="audit-meta">
            Doc: <span class="font-mono">${esc(e.doc_id.slice(0,16))}…</span>
            · Actor: <strong>${esc(e.actor)}</strong>
            · ${fmtDate(e.ts)} at ${fmtTime(e.ts)}
          </div>
          ${Object.keys(e.counts||{}).length ? `<div class="audit-hash text-xs mt-1">${Object.entries(e.counts).map(([k,v])=>`${k}: ${v}`).join(' · ')}</div>` : ''}
        </div>
        <div style="flex-shrink:0;font-size:10px;font-family:monospace;color:var(--text-muted);padding-left:12px;text-align:right">
          ${esc(e.hash_prefix || '')}
        </div>
      </div>`).join('');
  }

  el.innerHTML = `
    <div class="page-title mb-1">Audit Trail</div>
    <div class="page-sub mb-4">${events.length} events · Hash-chained tamper-evident log</div>

    <div class="alert alert-navy mb-4">
      <span class="alert-icon">🔗</span>
      <span>Each event's hash is computed over <code style="font-size:11px;background:rgba(37,99,235,.1);padding:1px 5px;border-radius:3px">SHA-256(prev_hash ‖ ts ‖ stage ‖ doc_id ‖ actor ‖ action ‖ counts)</code>. Modifying any event breaks all subsequent hashes. <strong>Counts store entity type tallies only — never raw entity values.</strong></span>
    </div>

    <div class="card">
      <div class="card-header" style="gap:10px">
        <div class="flex-1">
          <div class="card-title">Pipeline Events</div>
        </div>
        <div class="search-bar" style="width:240px">
          <span>🔍</span>
          <input id="audit-search" type="search" placeholder="Search events…" oninput="filterAudit()" aria-label="Search audit events">
        </div>
        <select class="form-input" style="width:140px" id="audit-stage" onchange="filterAudit()" aria-label="Filter by stage">
          <option value="">All stages</option>
          ${stages.map(s => `<option>${esc(s)}</option>`).join('')}
        </select>
        <select class="form-input" style="width:140px" id="audit-action" onchange="filterAudit()" aria-label="Filter by action">
          <option value="">All actions</option>
          ${actions.map(a => `<option>${esc(a)}</option>`).join('')}
        </select>
      </div>
      <div class="card-body" style="padding:12px 20px">
        <div id="audit-list">${renderAuditList(events)}</div>
      </div>
      <div class="card-footer">
        Showing ${events.length} events · Partial hashes shown for brevity · Raw entity values are never recorded
      </div>
    </div>
  `;

  window._renderAuditList = renderAuditList;
}

function filterAudit() {
  const q     = document.getElementById('audit-search')?.value.toLowerCase() || '';
  const stage = document.getElementById('audit-stage')?.value || '';
  const action= document.getElementById('audit-action')?.value || '';
  const filtered = state.auditEvents.filter(e => {
    const text = `${e.stage} ${e.action} ${e.doc_id} ${e.actor}`.toLowerCase();
    return (!q || text.includes(q)) && (!stage || e.stage === stage) && (!action || e.action === action);
  });
  const list = document.getElementById('audit-list');
  if (!list || !window._renderAuditList) return;
  list.innerHTML = filtered.length
    ? window._renderAuditList(filtered)
    : `<div class="empty-state" style="min-height:80px"><div class="empty-desc">No matching events.</div></div>`;
}

// ═══════════════════════════════════════════════════════════════════
//  SCREEN 8 — SERVICE HEALTH
// ═══════════════════════════════════════════════════════════════════
async function renderHealth(el) {
  let services = {};
  try { const d = await api('/dashboard'); services = d.services || {}; } catch(_) {}

  const checks = await api('/healthz').catch(() => ({ status:'error' }));
  const apiOk = checks.status === 'ok';

  const svcList = [
    { name:'FastAPI / REST API',          key:'api',      icon:'◎', desc:'Document upload, assessment management, and API key auth' },
    { name:'Document Ingestion',          key:'ingestion',icon:'📄', desc:'PDF (PyMuPDF + OCR), DOCX (python-docx), XLSX (openpyxl)' },
    { name:'PII Detection (Presidio)',    key:'pii',      icon:'🔍', desc:'Custom recognizers + pattern matching + entropy detection' },
    { name:'Local NLP (spaCy)',           key:'nlp',      icon:'🧠', desc:'Dependency parse, relation graph, sentence-transformer embeddings' },
    { name:'Policy Engine',              key:'policy',   icon:'📐', desc:'YAML rules → sensitivity decisions + monotonicity enforcement' },
    { name:'Security Gate',              key:'gate',     icon:'⬡', desc:'Re-scan · Vault check · Entropy check · HMAC signing' },
    { name:'AI Analysis (Ollama)',        key:'ollama',   icon:'🤖', desc:'llama3.1:8b on internal Docker network — FakeLLM in dev mode' },
    { name:'Risk Engine',                key:'risk',     icon:'⚑', desc:'Severity scoring, control mapping, remediation recommendations' },
    { name:'Workflow Engine',            key:'workflow', icon:'⇄', desc:'State machine with separation-of-duties enforcement' },
    { name:'OneTrust Adapter',           key:'onetrust', icon:'📤', desc:'Mock adapter (default) · HTTP client for live environments' },
    { name:'Database',                   key:'database', icon:'🗄', desc:'PostgreSQL 16 (assessments, vault, audit, outbox) — in-memory in dev' },
    { name:'Audit Log',                  key:'audit',    icon:'🔗', desc:'Hash-chained append-only event log with chain verification' },
  ];

  const statusDot = (key) => {
    const s = services[key];
    if (!s || s === 'ok')     return '<span class="status-dot dot-green" style="display:inline-block"></span>';
    if (s === 'mock')         return '<span class="status-dot dot-amber" style="display:inline-block"></span>';
    if (s === 'in-memory')    return '<span class="status-dot dot-amber" style="display:inline-block"></span>';
    return '<span class="status-dot dot-red" style="display:inline-block"></span>';
  };
  const statusLabel = (key) => {
    const s = services[key];
    if (!s || s === 'ok') return '<span class="badge badge-emerald">Operational</span>';
    if (s === 'mock')     return '<span class="badge badge-amber">Mock</span>';
    if (s === 'in-memory')return '<span class="badge badge-amber">In-memory</span>';
    return '<span class="badge badge-red">Error</span>';
  };

  const rows = svcList.map(s => `
    <tr>
      <td>
        <div class="flex items-center gap-2">
          ${statusDot(s.key)}
          <div>
            <div class="font-bold">${s.icon} ${esc(s.name)}</div>
            <div class="td-muted">${esc(s.desc)}</div>
          </div>
        </div>
      </td>
      <td>${statusLabel(s.key)}</td>
      <td class="td-muted text-xs">${esc(services[s.key] || 'ok')}</td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="page-title mb-1">Service Health</div>
    <div class="page-sub mb-4">Pipeline component status and configuration</div>

    <div class="stat-grid mb-6">
      <div class="stat-card ${apiOk ? 'accent-emerald':'accent-red'}">
        <div class="stat-label">API Health</div>
        <div class="stat-value" style="font-size:16px">${apiOk ? '✓ Healthy':'✗ Error'}</div>
        <div class="stat-hint">/api/v1/healthz</div>
      </div>
      <div class="stat-card accent-emerald">
        <div class="stat-label">Security Gate</div>
        <div class="stat-value" style="font-size:16px">✓ Active</div>
        <div class="stat-hint">Fail-closed · HMAC signing</div>
      </div>
      <div class="stat-card accent-amber">
        <div class="stat-label">AI Analysis</div>
        <div class="stat-value" style="font-size:16px">~ FakeLLM</div>
        <div class="stat-hint">Ollama mock active</div>
      </div>
      <div class="stat-card accent-amber">
        <div class="stat-label">Database</div>
        <div class="stat-value" style="font-size:16px">~ In-memory</div>
        <div class="stat-hint">No persistence between restarts</div>
      </div>
    </div>

    <div class="card mb-6">
      <div class="card-header"><div class="card-title">Component Status</div></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Component</th><th>Status</th><th>Notes</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>

    <div class="alert alert-navy mb-4">
      <span class="alert-icon">ℹ</span>
      <span>Credentials, signing keys, vault keys, and other secrets are loaded from environment variables only — never from config files, and never displayed in the UI. The vault key and HMAC signing key are not accessible to the frontend.</span>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">Configuration Notes</div></div>
      <div class="card-body">
        <div class="alert alert-amber mb-3">
          <span class="alert-icon">⚠</span>
          <span><strong>Development mode:</strong> FakeLLM is active (use_fake_llm=True). Set TPRM_OLLAMA_URL and ensure Ollama is running for live AI analysis.</span>
        </div>
        <div class="alert alert-amber mb-3">
          <span class="alert-icon">⚠</span>
          <span><strong>In-memory storage:</strong> Assessments and audit events are not persisted across restarts. Configure TPRM_DATABASE_URL for PostgreSQL persistence.</span>
        </div>
        <div class="alert alert-blue">
          <span class="alert-icon">ℹ</span>
          <span><strong>OneTrust adapter:</strong> Mock mode is active by default. Set TPRM_ONETRUST_ADAPTER=http and provide credentials to enable live integration.</span>
        </div>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════════════
//  INITIALISATION
// ═══════════════════════════════════════════════════════════════════
(async function init() {
  // Keyboard nav for sidebar
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); item.click(); } });
  });
  // Load initial screen
  await renderScreen('dashboard');
})();
</script>
</body>
</html>
