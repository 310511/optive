<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPRM Platform — Privacy-Preserving Vendor Risk</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   DESIGN TOKENS — Supabase-inspired enterprise security palette
═══════════════════════════════════════════════════════════════════ */
:root {
  /* Brand */
  --emerald:       #3ECF8E;
  --emerald-hover: #24B47E;
  --emerald-dark:  #1a9966;
  --navy:          #102A43;
  --navy-dark:     #0B1F33;
  --navy-mid:      #1a3a55;
  --navy-light:    #1e4060;

  /* Surfaces */
  --bg:            #FFFFFF;
  --bg-alt:        #F5F7FA;
  --bg-subtle:     #FAFAFA;
  --border:        #DFE5EC;
  --border-strong: #CBD5E1;

  /* Typography */
  --text-primary:   #171717;
  --text-secondary: #64748B;
  --text-muted:     #94A3B8;
  --text-on-dark:   #FFFFFF;
  --text-on-dark-2: #94a3b8;

  /* Semantic states */
  --green:          #15803D;
  --green-bg:       #F0FDF4;
  --green-border:   #BBF7D0;
  --green-mid:      #22c55e;

  --amber:          #D97706;
  --amber-bg:       #FFFBEB;
  --amber-border:   #FDE68A;

  --red:            #DC2626;
  --red-bg:         #FEF2F2;
  --red-border:     #FECACA;

  --blue:           #2563EB;
  --blue-bg:        #EFF6FF;
  --blue-border:    #BFDBFE;

  --purple:         #7C3AED;
  --purple-bg:      #F5F3FF;
  --purple-border:  #DDD6FE;

  /* Layout */
  --sidebar-w:      232px;
  --topbar-h:       56px;
  --radius-sm:      6px;
  --radius:         8px;
  --radius-lg:      12px;
  --shadow-sm:      0 1px 2px rgba(0,0,0,.05);
  --shadow:         0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:      0 4px 6px -1px rgba(0,0,0,.07), 0 2px 4px -1px rgba(0,0,0,.05);
  --shadow-lg:      0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -2px rgba(0,0,0,.04);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  background: var(--bg-alt);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

/* ═══════════════════════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════════════════════ */
.sidebar {
  width: var(--sidebar-w);
  min-height: 100vh;
  background: var(--navy-dark);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 200;
  overflow-y: auto;
  transition: transform .25s ease;
}
.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.brand-icon {
  width: 34px; height: 34px;
  background: var(--emerald);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.brand-name { font-size: 14px; font-weight: 700; color: var(--text-on-dark); letter-spacing: -.2px; }
.brand-sub  { font-size: 11px; color: var(--text-on-dark-2); margin-top: 1px; }

.sidebar-section {
  padding: 16px 10px 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: rgba(148,163,184,.5);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  margin: 1px 6px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  color: rgba(148,163,184,.85);
  transition: background .15s, color .15s;
  user-select: none;
}
.nav-item:hover { background: rgba(255,255,255,.07); color: var(--text-on-dark); }
.nav-item.active {
  background: rgba(62,207,142,.12);
  color: var(--emerald);
  font-weight: 600;
}
.nav-item .nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.nav-item .nav-badge {
  margin-left: auto;
  background: rgba(220,38,38,.9);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}
.nav-item .nav-badge.amber { background: rgba(217,119,6,.9); }
.nav-item .nav-badge.blue  { background: rgba(37,99,235,.9); }

.sidebar-footer {
  margin-top: auto;
  padding: 12px;
  border-top: 1px solid rgba(255,255,255,.06);
}
.service-status {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  font-size: 11px;
  color: rgba(148,163,184,.7);
}
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot-green  { background: var(--green-mid); box-shadow: 0 0 0 2px rgba(34,197,94,.2); }
.dot-amber  { background: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,.2); }
.dot-red    { background: var(--red); }
.dot-gray   { background: rgba(148,163,184,.4); }

/* ── Mobile sidebar toggle ── */
.sidebar-toggle {
  display: none;
  position: fixed;
  top: 12px; left: 12px;
  z-index: 300;
  background: var(--navy-dark);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  width: 36px; height: 36px;
  font-size: 18px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* ═══════════════════════════════════════════════════════════════════
   MAIN CONTENT AREA
═══════════════════════════════════════════════════════════════════ */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* ── Top bar ── */
.topbar {
  height: var(--topbar-h);
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 12px;
  position: sticky;
  top: 0; z-index: 100;
  box-shadow: var(--shadow-sm);
}
.topbar-title { font-size: 15px; font-weight: 700; color: var(--text-primary); }
.topbar-sub   { font-size: 12px; color: var(--text-muted); margin-left: 4px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.topbar-badge {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 5px 10px;
  font-size: 12px;
  color: var(--text-secondary);
}

/* ── Page content ── */
.page-content { flex: 1; padding: 24px; max-width: 1280px; }

/* ═══════════════════════════════════════════════════════════════════
   TYPOGRAPHY
═══════════════════════════════════════════════════════════════════ */
.page-title   { font-size: 20px; font-weight: 700; color: var(--text-primary); letter-spacing: -.3px; }
.page-sub     { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.section-title{ font-size: 13px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .6px; }

/* ═══════════════════════════════════════════════════════════════════
   CARDS
═══════════════════════════════════════════════════════════════════ */
.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}
.card-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-title { font-size: 14px; font-weight: 700; color: var(--text-primary); }
.card-sub   { font-size: 12px; color: var(--text-muted); }
.card-body  { padding: 16px 20px; }
.card-footer{
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-muted);
  background: var(--bg-subtle);
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}

/* ── Stat cards ── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.stat-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
}
.stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); }
.stat-value { font-size: 28px; font-weight: 800; color: var(--text-primary); line-height: 1.1; margin-top: 4px; }
.stat-hint  { font-size: 11px; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
.stat-card.accent-green .stat-value { color: var(--green); }
.stat-card.accent-red   .stat-value { color: var(--red); }
.stat-card.accent-amber .stat-value { color: var(--amber); }
.stat-card.accent-blue  .stat-value { color: var(--blue); }
.stat-card.accent-emerald .stat-value { color: var(--emerald-dark); }

/* ═══════════════════════════════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 13px; font-weight: 600;
  cursor: pointer; border: none;
  transition: background .15s, box-shadow .15s, transform .08s;
  white-space: nowrap;
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary  { background: var(--emerald); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--emerald-hover); box-shadow: 0 0 0 3px rgba(62,207,142,.25); }
.btn-secondary{ background: var(--bg); color: var(--text-primary); border: 1px solid var(--border-strong); }
.btn-secondary:hover:not(:disabled){ background: var(--bg-alt); }
.btn-danger   { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.btn-danger:hover:not(:disabled){ background: #fee2e2; }
.btn-ghost    { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg-alt); color: var(--text-primary); }
.btn-sm { padding: 5px 11px; font-size: 12px; }
.btn-lg { padding: 11px 22px; font-size: 14px; }
.btn-full { width: 100%; }
.btn-icon { padding: 7px; border-radius: var(--radius-sm); }

/* ═══════════════════════════════════════════════════════════════════
   BADGES
═══════════════════════════════════════════════════════════════════ */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 11px; font-weight: 700;
  letter-spacing: .2px;
  white-space: nowrap;
}
.badge-green   { background: var(--green-bg);   color: var(--green);   border: 1px solid var(--green-border); }
.badge-amber   { background: var(--amber-bg);   color: var(--amber);   border: 1px solid var(--amber-border); }
.badge-red     { background: var(--red-bg);     color: var(--red);     border: 1px solid var(--red-border); }
.badge-blue    { background: var(--blue-bg);    color: var(--blue);    border: 1px solid var(--blue-border); }
.badge-purple  { background: var(--purple-bg);  color: var(--purple);  border: 1px solid var(--purple-border); }
.badge-gray    { background: var(--bg-alt);     color: var(--text-secondary); border: 1px solid var(--border); }
.badge-navy    { background: #e8f0ff;           color: var(--navy);    border: 1px solid #c7d8f7; }
.badge-emerald { background: #ecfdf5;           color: var(--emerald-dark); border: 1px solid #a7f3d0; }
.badge-lg { padding: 4px 12px; font-size: 12px; }

/* ═══════════════════════════════════════════════════════════════════
   FORMS
═══════════════════════════════════════════════════════════════════ */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block;
  font-size: 12px; font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 5px;
}
.form-input {
  width: 100%;
  padding: 8px 12px;
  border: 1.5px solid var(--border-strong);
  border-radius: var(--radius);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--bg);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.form-input:focus {
  border-color: var(--emerald);
  box-shadow: 0 0 0 3px rgba(62,207,142,.15);
}
.form-input::placeholder { color: var(--text-muted); }
.form-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* Drop zone */
.drop-zone {
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  background: var(--bg-alt);
  position: relative;
}
.drop-zone:hover, .drop-zone.over {
  border-color: var(--emerald);
  background: #f0fdf4;
}
.drop-zone input[type=file] {
  position: absolute; inset: 0;
  opacity: 0; cursor: pointer;
  width: 100%; height: 100%;
}
.drop-zone-icon  { font-size: 36px; margin-bottom: 8px; }
.drop-zone-text  { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.drop-zone-text span { color: var(--emerald-dark); text-decoration: underline; }
.drop-zone-hint  { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.drop-zone-file  { font-size: 12px; color: var(--emerald-dark); font-weight: 600; margin-top: 8px; }

/* ═══════════════════════════════════════════════════════════════════
   TABLES
═══════════════════════════════════════════════════════════════════ */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  padding: 9px 14px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text-muted);
  background: var(--bg-alt);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
thead th:first-child { border-radius: var(--radius-sm) 0 0 0; }
thead th:last-child  { border-radius: 0 var(--radius-sm) 0 0; }
tbody td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text-primary);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--bg-alt); }
.td-mono { font-family: "SF Mono","Fira Code",Menlo,monospace; font-size: 12px; color: var(--text-secondary); }
.td-muted { color: var(--text-muted); font-size: 12px; }

/* ═══════════════════════════════════════════════════════════════════
   ALERTS / BANNERS
═══════════════════════════════════════════════════════════════════ */
.alert {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  line-height: 1.5;
}
.alert-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.alert-green  { background: var(--green-bg);  border: 1px solid var(--green-border);  color: #166534; }
.alert-amber  { background: var(--amber-bg);  border: 1px solid var(--amber-border);  color: #92400e; }
.alert-red    { background: var(--red-bg);    border: 1px solid var(--red-border);    color: #991b1b; }
.alert-blue   { background: var(--blue-bg);   border: 1px solid var(--blue-border);   color: #1e40af; }
.alert-navy   { background: #eef2ff;          border: 1px solid #c7d2fe;              color: var(--navy); }

/* ═══════════════════════════════════════════════════════════════════
   SECURITY GATE — distinctive elements
═══════════════════════════════════════════════════════════════════ */
.gate-boundary {
  background: linear-gradient(135deg, #0b1f33 0%, #102a43 100%);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: var(--radius-lg);
  color: var(--text-on-dark);
  padding: 20px;
  margin-bottom: 20px;
}
.gate-boundary-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--emerald);
  margin-bottom: 12px;
}
.gate-zone {
  border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  font-size: 12px;
}
.gate-zone-private {
  background: rgba(22,163,74,.08);
  border-color: rgba(22,163,74,.25);
}
.gate-zone-gate {
  background: rgba(217,119,6,.12);
  border-color: rgba(217,119,6,.4);
  border-width: 1.5px;
}
.gate-zone-ai {
  background: rgba(37,99,235,.08);
  border-color: rgba(37,99,235,.25);
}
.gate-zone-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .8px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.zone-private-label { color: #4ade80; }
.zone-gate-label    { color: #fbbf24; }
.zone-ai-label      { color: #93c5fd; }

.gate-check {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
}
.gate-check:last-child { margin-bottom: 0; }
.gate-check-icon { font-size: 16px; flex-shrink: 0; }
.gate-check-name { font-size: 13px; font-weight: 600; flex: 1; }
.gate-check-desc { font-size: 11px; color: var(--text-muted); }

/* HMAC disclaimer */
.hmac-note {
  background: var(--amber-bg);
  border: 1px solid var(--amber-border);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 12px;
  color: #92400e;
  margin-top: 12px;
  line-height: 1.5;
}

/* ═══════════════════════════════════════════════════════════════════
   PIPELINE PROGRESS
═══════════════════════════════════════════════════════════════════ */
.pipeline-steps { display: flex; flex-direction: column; gap: 2px; }
.pipe-step {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-muted);
}
.pipe-step .ps-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border-strong);
  flex-shrink: 0;
  transition: background .3s;
}
.pipe-step.ps-done  { color: var(--green); }
.pipe-step.ps-done  .ps-dot { background: var(--green-mid); }
.pipe-step.ps-active{ color: var(--text-primary); font-weight: 600; }
.pipe-step.ps-active .ps-dot { background: var(--blue); box-shadow: 0 0 0 3px var(--blue-border); animation: pulse .9s infinite; }
.pipe-step .ps-label { flex: 1; }
.pipe-step .ps-time  { font-size: 11px; font-family: "SF Mono", Menlo, monospace; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

/* ═══════════════════════════════════════════════════════════════════
   FINDING CARDS
═══════════════════════════════════════════════════════════════════ */
.finding-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 10px;
  transition: box-shadow .15s;
}
.finding-card:hover { box-shadow: var(--shadow-md); }
.finding-card-top {
  display: flex;
  cursor: pointer;
  user-select: none;
}
.finding-card-top:hover { background: var(--bg-alt); }
.finding-stripe { width: 4px; flex-shrink: 0; }
.sev-Critical .finding-stripe { background: var(--red); }
.sev-High     .finding-stripe { background: #f97316; }
.sev-Medium   .finding-stripe { background: var(--amber); }
.sev-Low      .finding-stripe { background: var(--green); }
.finding-body { flex: 1; padding: 14px 16px; min-width: 0; }
.finding-location {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--bg-alt); border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 2px 8px; font-size: 11px;
  color: var(--text-secondary); margin-bottom: 7px;
}
.finding-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
.finding-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
.finding-desc  { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.finding-right {
  display: flex; flex-direction: column; align-items: center;
  padding: 14px 14px 14px 0; gap: 6px; flex-shrink: 0;
}
.score-ring {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2px solid;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800;
}
.sr-Critical { border-color: var(--red);   color: var(--red); }
.sr-High     { border-color: #f97316; color: #f97316; }
.sr-Medium   { border-color: var(--amber); color: var(--amber); }
.sr-Low      { border-color: var(--green); color: var(--green); }
.finding-chevron { font-size: 10px; color: var(--text-muted); transition: transform .2s; }
.finding-chevron.open { transform: rotate(180deg); }
.finding-detail {
  display: none;
  border-top: 1px solid var(--border);
  padding: 16px 18px;
  background: var(--bg-subtle);
}
.finding-detail.open { display: block; }
.detail-section { margin-bottom: 14px; }
.detail-section:last-child { margin-bottom: 0; }
.detail-label {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .6px;
  color: var(--text-muted); margin-bottom: 6px;
}
.detail-found-box {
  background: #fff8f0;
  border-left: 3px solid #f97316;

  padding: 10px 14px;
  font-size: 12px; line-height: 1.6;
}
.detail-why-box {
  background: var(--bg-alt); border-radius: var(--radius-sm);
  padding: 10px 14px; font-size: 12px; line-height: 1.6;
}
.detail-action-box {
  background: var(--blue-bg); border: 1px solid var(--blue-border);
  border-radius: var(--radius-sm);
  padding: 10px 14px; font-size: 12px; line-height: 1.6;
  display: flex; gap: 8px; color: #1e40af;
}
.control-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.control-chip {
  background: var(--bg-alt); border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 3px 8px; font-size: 11px; color: var(--text-secondary);
}

/* ═══════════════════════════════════════════════════════════════════
   WORKFLOW STATE MACHINE
═══════════════════════════════════════════════════════════════════ */
.workflow-track {
  display: flex;
  align-items: center;
  gap: 0;
  overflow-x: auto;
  padding-bottom: 4px;
}
.wf-node {
  display: flex; flex-direction: column; align-items: center;
  flex-shrink: 0;
}
.wf-circle {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 2px solid var(--border-strong);
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  transition: all .2s;
}
.wf-circle.wf-done   { background: var(--green-bg);   border-color: var(--green-mid); color: var(--green); }
.wf-circle.wf-active { background: var(--blue-bg);    border-color: var(--blue);      color: var(--blue);  box-shadow: 0 0 0 3px var(--blue-border); }
.wf-circle.wf-alert  { background: var(--red-bg);     border-color: var(--red);       color: var(--red); }

/* ═══════════════════════════════════════════════════════════════════
   AUDIT LOG
═══════════════════════════════════════════════════════════════════ */

  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.audit-row:last-child { border-bottom: none; }
.audit-dot-col { display: flex; flex-direction: column; align-items: center; padding-top: 3px; }
.audit-dot-outer {
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 2px solid;
  flex-shrink: 0;
}
.audit-line { width: 2px; flex: 1; background: var(--border); min-height: 16px; margin-top: 3px; }
.audit-content { flex: 1; min-width: 0; }
.audit-action { font-size: 13px; font-weight: 600; color: var(--text-primary); }

/* ═══════════════════════════════════════════════════════════════════
   EMPTY STATES
═══════════════════════════════════════════════════════════════════ */
.empty-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;

  text-align: center;

}

/* ═══════════════════════════════════════════════════════════════════
   LOADING / SPINNER
═══════════════════════════════════════════════════════════════════ */
.spin {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
}
.spin-dark {
  border-color: rgba(0,0,0,.1);
  border-top-color: var(--emerald);
}
@keyframes spin { to { transform: rotate(360deg); } }

.skeleton {
  background: linear-gradient(90deg, var(--bg-alt) 25%, var(--border) 50%, var(--bg-alt) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}

/* ═══════════════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════════════ */

.toast.toast-error   { border-left: 3px solid var(--red); }

@keyframes slide-in { from{transform:translateX(100%);opacity:0} to{transform:none;opacity:1} }

/* ═══════════════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════════════ */

═══════════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════════════ */
.flex        { display: flex; }

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════
//  CONSTANTS & API CLIENT
// ═══════════════════════════════════════════════════════════════════
const API_KEY = 'dev-insecure-key';
const BASE    = '/api/v1';

async function api(path, opts = {}) {
  const r = await fetch(BASE + path, {
    ...opts,
    headers: { 'X-API-Key': API_KEY, ...(opts.headers || {}) },
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({ error: r.statusText }));
    throw Object.assign(new Error(err.detail || err.error || 'Request failed'), { status: r.status });
  }
  return r.json();
}

// ── App state ──────────────────────────────────────────────────────
const state = {
  currentScreen: 'dashboard',
  assessments: [],
  findings: [],
  gateDecisions: [],
  auditEvents: [],
  dashboard: null,
  selectedAssessment: null,
};

// ═══════════════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════════════
function toast(msg, type = 'success', duration = 4000) {
  const c = document.getElementById('toast-container');
  const icons = { success: '✓', error: '✗', warn: '⚠' };
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `<span>${icons[type] || '•'}</span><span>${esc(msg)}</span>`;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, duration);
}

// ═══════════════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════════════
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}
function timeAgo(iso) {
  if (!iso) return '';
  const sec = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (sec < 60) return 'just now';
  if (sec < 3600) return `${Math.floor(sec/60)}m ago`;
  if (sec < 86400) return `${Math.floor(sec/3600)}h ago`;
  return `${Math.floor(sec/86400)}d ago`;
}

// Severity helpers
const SEV_BADGE = {
  Critical: 'badge-red',
  High:     'badge badge-red',
  Medium:   'badge badge-amber',
  Low:      'badge badge-green',
};
function sevBadge(sev) {
  const cls = { Critical:'badge-red', High:'badge-red', Medium:'badge-amber', Low:'badge-green' }[sev] || 'badge-gray';
  const dot = { Critical:'🔴', High:'🟠', Medium:'🟡', Low:'🟢' }[sev] || '⚪';
  return `<span class="badge ${cls}">${dot} ${esc(sev)}</span>`;
}
function sensitivityBadge(s) {
  const map = { RESTRICTED:'badge-red', CONFIDENTIAL:'badge-amber', INTERNAL:'badge-blue', PUBLIC:'badge-green' };
  return `<span class="badge ${map[s]||'badge-gray'}">${esc(s)}</span>`;
}
function statusBadge(s) {
  const map = {
    Draft:'badge-gray', InReview:'badge-blue', RemediationRequested:'badge-amber',
    RemediationInProgress:'badge-amber', Verified:'badge-green', Accepted:'badge-emerald',
    Rejected:'badge-red', Escalated:'badge-red',
  };
  return `<span class="badge ${map[s]||'badge-gray'}">${esc(s)}</span>`;
}
function stageBadge(stage) {
  const map = { ingestion:'badge-blue', pii:'badge-purple', nlp:'badge-blue',
    policy:'badge-amber', sanitize:'badge-amber', gate:'badge-red',
    ai:'badge-blue', risk:'badge-amber', onetrust:'badge-green' };
  return `<span class="badge ${map[stage]||'badge-gray'}">${esc(stage)}</span>`;
}
function actionBadge(action) {
  const map = { passed:'badge-emerald', quarantine:'badge-red', analyzed:'badge-blue',
    sanitized:'badge-amber', detected:'badge-purple', classified:'badge-blue',
    parsed:'badge-gray', findings_generated:'badge-green' };
  return `<span class="badge ${map[action]||'badge-gray'}">${esc(action)}</span>`;
}

// Entity type display
const ETYPES = {
  API_KEY:           { label:'API Key',          chip:'chip-red',    icon:'🔑' },
  PEM_PRIVATE_KEY:   { label:'Private Key',       chip:'chip-red',    icon:'🔐' },
  CREDENTIAL_URL:    { label:'Credential URL',    chip:'chip-red',    icon:'🔓' },
  US_SSN:            { label:'SSN',               chip:'chip-red',    icon:'🪪' },
  CREDIT_CARD:       { label:'Credit Card',       chip:'chip-red',    icon:'💳' },
  IBAN_CODE:         { label:'IBAN',              chip:'chip-red',    icon:'🏦' },
  BANK_ACCOUNT:      { label:'Bank Account',      chip:'chip-red',    icon:'🏦' },
  EMAIL_ADDRESS:     { label:'Email',             chip:'chip-orange', icon:'📧' },
  PHONE_NUMBER:      { label:'Phone',             chip:'chip-orange', icon:'📞' },
  PERSON:            { label:'Name',              chip:'chip-orange', icon:'👤' },
  IP_ADDRESS:        { label:'Internal IP',       chip:'chip-amber',  icon:'🌐' },
  INTERNAL_HOSTNAME: { label:'Hostname',          chip:'chip-amber',  icon:'🖥' },
  EMPLOYEE_ID:       { label:'Employee ID',       chip:'chip-amber',  icon:'🪪' },
  DATE_OF_BIRTH:     { label:'Date of Birth',     chip:'chip-red',    icon:'📅' },
  CONTRACT_NUMBER:   { label:'Contract №',        chip:'chip-blue',   icon:'📄' },
  MAC_ADDRESS:       { label:'MAC Address',       chip:'chip-amber',  icon:'🔌' },
};
function entityChip(t) {
  const d = ETYPES[t] || { label: t.replace(/_/g,' '), chip:'chip-gray', icon:'⚠' };
  return `<span class="chip ${d.chip}">${d.icon} ${d.label}</span>`;
}

const SCREENS = {
  dashboard:'Overview', assessments:'Assessments', upload:'New Assessment',
  gate:'Security Gate', findings:'Risk Findings', workflow:'Workflow & Approvals',
  audit:'Audit Trail', health:'Service Health',
};
const SCREEN_SUBS = {
  dashboard:'Privacy-preserving vendor risk pipeline',
  assessments:'All vendor document assessments',

  gate:'Trust boundary — private zone → AI zone',
  findings:'Normalised risk findings across all vendors',
  workflow:'Assessment review and approval workflow',
  audit:'Hash-chained immutable audit log',
  health:'Pipeline component status',
};

function goto(screen, data) {
  state.currentScreen = screen;
  if (data) state[`${screen}Data`] = data;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById(`nav-${screen}`);
  if (nav) nav.classList.add('active');
  document.getElementById('topbar-title').textContent = SCREENS[screen] || screen;
  document.getElementById('topbar-sub').textContent = SCREEN_SUBS[screen] || '';
  closeSidebar();
  renderScreen(screen);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

// Keyboard nav for sidebar items
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('nav-item')) e.target.click();
});

// ═══════════════════════════════════════════════════════════════════
//  SCREEN ROUTER
// ═══════════════════════════════════════════════════════════════════
async function renderScreen(screen) {
  const el = document.getElementById('page-content');
  el.innerHTML = loadingHTML();
  try {
    switch (screen) {
      case 'dashboard':   await renderDashboard(el); break;
      case 'assessments': await renderAssessments(el); break;
      case 'upload':      renderUpload(el); break;
      case 'gate':        await renderGate(el); break;
      case 'findings':    await renderFindings(el); break;
      case 'workflow':    await renderWorkflow(el); break;
      case 'audit':       await renderAudit(el); break;
      case 'health':      await renderHealth(el); break;
      default: el.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">Screen not found</div></div>`;
    }
  } catch(e) {
    el.innerHTML = errorHTML(e.message);
  }
}

function loadingHTML() {
  return `<div class="empty-state"><div class="spin spin-dark" style="width:32px;height:32px;border-width:3px"></div><div class="empty-title mt-3">Loading…</div></div>`;
}
function errorHTML(msg) {
  return `<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-title">Error loading data</div><div class="empty-desc">${esc(msg)}</div><button class="btn btn-secondary mt-3" onclick="renderScreen(state.currentScreen)">Try again</button></div>`;
}

function emptyDashboard() {
  return { total_assessments:0, in_progress:0, high_critical_findings:0, quarantined:0, awaiting_approval:0, recent_assessments:[], recent_audit_events:[], services:{} };
}
function auditColor(stage) {
  const m = { ingestion:'#3b82f6', pii:'#8b5cf6', nlp:'#3b82f6', policy:'#f59e0b',
    sanitize:'#f59e0b', gate:'#f97316', ai:'#3b82f6', risk:'#f59e0b', onetrust:'#22c55e' };
  return m[stage] || '#94a3b8';
}
function auditBg(stage) {
  const m = { gate:'#fef3c7', ai:'#eff6ff', onetrust:'#f0fdf4', pii:'#f5f3ff' };
  return m[stage] || 'transparent';
}

<script>
// ═══════════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════════
async function renderAssessments(el) {
  const list = await api('/assessments').catch(() => []);
  state.assessments = list;

  if (list.length === 0) {
    el.innerHTML = `
      <div class="flex justify-between items-center mb-4">
        <div><div class="page-title">Assessments</div><div class="page-sub">All vendor document assessments</div></div>
        <button class="btn btn-primary" onclick="goto('upload')">+ New Assessment</button>
      </div>
      <div class="card"><div class="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-title">No assessments yet</div>
        <div class="empty-desc">Submit a vendor document to begin a privacy-preserving risk assessment.</div>
        <button class="btn btn-primary mt-3" onclick="goto('upload')">Upload a document</button>
      </div></div>`;
    return;
  }

  const rows = list.map(a => `
    <tr>
      <td>
        <div class="font-bold">${esc(a.vendor_id)}</div>
        <div class="td-muted truncate" style="max-width:180px">${esc(a.filename)}</div>
      </td>
      <td>${sensitivityBadge(a.sensitivity)}</td>
      <td>${statusBadge(a.workflow_status)}</td>
      <td>
        ${a.high_critical > 0 ? `<span class="badge badge-red">${a.high_critical} High/Crit</span>` : ''}
        <span class="td-muted">${a.finding_count} total</span>
      </td>
      <td>
        <span class="badge ${a.gate_passed ? 'badge-emerald' : 'badge-red'}">${a.gate_passed ? '✓ Passed' : '✗ Quarantined'}</span>
      </td>
      <td class="td-muted">${fmtDateTime(a.created_at)}</td>
      <td>
        <button id="assessment-detail-trigger-${esc(a.assessment_id)}" class="btn btn-secondary btn-sm" onclick="openAssessmentDetail('${esc(a.assessment_id)}')">View</button>
      </td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="flex justify-between items-center mb-4">
      <div><div class="page-title">Assessments</div><div class="page-sub">${list.length} vendor document${list.length !== 1 ? 's' : ''} assessed</div></div>
      <button class="btn btn-primary" onclick="goto('upload')">+ New Assessment</button>
    </div>
    <div class="card mb-4">
      <div class="card-header" style="gap:12px">
        <div class="search-bar flex-1">
          <span aria-hidden="true">🔍</span>
          <input id="assess-search" type="search" placeholder="Search by vendor or filename…" oninput="filterAssessments()" aria-label="Search assessments">
        </div>
        <select class="form-input" style="width:160px" id="assess-filter-status" onchange="filterAssessments()" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option>Draft</option><option>InReview</option><option>RemediationRequested</option>
          <option>Verified</option><option>Accepted</option><option>Rejected</option><option>Escalated</option>
        </select>
        <select class="form-input" style="width:160px" id="assess-filter-sens" onchange="filterAssessments()" aria-label="Filter by sensitivity">
          <option value="">All sensitivity</option>
          <option>RESTRICTED</option><option>CONFIDENTIAL</option><option>INTERNAL</option><option>PUBLIC</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Vendor / Document</th><th>Sensitivity</th><th>Workflow</th><th>Findings</th><th>Gate</th><th>Date</th><th></th></tr></thead>
          <tbody id="assess-table">${rows}</tbody>
        </table>
      </div>
    </div>
    <div id="assess-detail"></div>
  `;
}

function filterAssessments() {
  const q   = document.getElementById('assess-search')?.value.toLowerCase() || '';
  const st  = document.getElementById('assess-filter-status')?.value || '';
  const sen = document.getElementById('assess-filter-sens')?.value || '';
  const rows = document.querySelectorAll('#assess-table tr');
  rows.forEach(row => {
    const text = row.textContent.toLowerCase();
    const matchQ   = !q   || text.includes(q);
    const matchSt  = !st  || text.includes(st.toLowerCase());
    const matchSen = !sen || text.includes(sen.toLowerCase());
    row.style.display = (matchQ && matchSt && matchSen) ? '' : 'none';
  });
}

async function openAssessmentDetail(id) {
  const det = document.getElementById('assess-detail');
  det.innerHTML = loadingHTML();
  try {
    const [detail, findings] = await Promise.all([
      api(`/assessments/${id}`),
      api(`/assessments/${id}/findings`),
    ]);
    const gr = detail.gate_report || {};
    const timings = detail.stage_timings || {};
    const maxMs = Math.max(...Object.values(timings).map(v => v * 1000), 1);
    const timingHtml = Object.entries(timings).map(([k, v]) => {
      const ms = Math.round(v * 1000), pct = Math.max(2, Math.round(ms / maxMs * 100));
      return `<div class="timing-row">
        <div class="timing-label">${esc(k.replace(/_/g,' '))}</div>
        <div class="timing-track"><div class="timing-fill" style="width:${pct}%"></div></div>
        <div class="timing-ms">${ms}ms</div>
      </div>`;
    }).join('');

    const findingsHtml = findings.length
      ? findings.sort((a,b) => b.score - a.score).map((f,i) => buildFindingCard(f,`d-${i}`)).join('')
      : `<div class="empty-state" style="min-height:120px"><div class="empty-icon" style="font-size:32px">✓</div><div class="empty-title">No findings</div></div>`;

    det.innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="flex-1">
            <div class="card-title">📄 ${esc(detail.filename)}</div>
            <div class="card-sub">Vendor: <strong>${esc(detail.vendor_id)}</strong> · ID: <span class="font-mono text-xs">${esc(id.slice(0,16))}…</span></div>
          </div>
          <div class="flex gap-2">
            ${sensitivityBadge(detail.sensitivity)}
            ${statusBadge(detail.workflow_status)}
          </div>
        </div>
        <div class="card-body p-0">
          <div class="tabs-bar">
            <div class="tab-item active" onclick="switchTab(this,'tab-findings-${esc(id)}')">Findings (${findings.length})</div>
            <div class="tab-item" onclick="switchTab(this,'tab-gate-${esc(id)}')">Gate Report</div>
            <div class="tab-item" onclick="switchTab(this,'tab-timing-${esc(id)}')">Stage Timings</div>
            <div class="tab-item" onclick="switchTab(this,'tab-workflow-${esc(id)}')">Workflow</div>
          </div>
          <div style="padding:16px 20px">
            <div class="tab-panel active" id="tab-findings-${esc(id)}">${findingsHtml}</div>
            <div class="tab-panel" id="tab-gate-${esc(id)}">
              <div class="stat-grid mb-4" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
                <div class="stat-card ${gr.passed ? 'accent-emerald':'accent-red'}">
                  <div class="stat-label">Outcome</div>
                  <div class="stat-value" style="font-size:18px">${gr.passed ? '✓ Passed':'✗ Quarantined'}</div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">Total Blocks</div>
                  <div class="stat-value">${gr.total_blocks || 0}</div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">Safe Path</div>
                  <div class="stat-value">${gr.safe_path_blocks || 0}</div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">Sensitive Path</div>
                  <div class="stat-value">${gr.sensitive_path_blocks || 0}</div>
                </div>
                <div class="stat-card ${gr.rescan_hits > 0 ? 'accent-red':''}">
                  <div class="stat-label">Re-scan Hits</div>
                  <div class="stat-value">${gr.rescan_hits || 0}</div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">Re-routed</div>
                  <div class="stat-value">${gr.rerouted_blocks || 0}</div>
                </div>
              </div>
              ${buildGateChecks(gr)}
              <div class="hmac-note mt-3">⚠ HMAC signature validity confirms payload integrity and authenticity under the configured signing key. It does not independently verify that the payload contains no PII — that is enforced by the gate re-scan, vault lookup, and entropy checks above.</div>
            </div>
            <div class="tab-panel" id="tab-timing-${esc(id)}">
              <p class="text-sm text-muted mb-3">Wall-clock time per pipeline stage</p>
              ${timingHtml || '<div class="empty-state" style="min-height:80px"><div class="empty-desc">No timing data.</div></div>'}
            </div>
            <div class="tab-panel" id="tab-workflow-${esc(id)}">
              ${buildWorkflowPanel(detail, id)}
            </div>
          </div>
        </div>
      </div>
    `;
  } catch(e) {
    det.innerHTML = errorHTML(e.message);
  }
}

function buildGateChecks(gr) {
  const checks = [
    { name:'PII Re-scan', desc:'Independent Presidio pass over all sanitized blocks (threshold 0.30)', pass: gr.rescan_hits === 0 },
    { name:'Vault Lookup', desc:'No known raw values appear verbatim or normalised in output', pass: true },
    { name:'Token Grammar', desc:'All [REDACTED:TYPE] and <<TYPE_xxxxxxxx>> placeholders are well-formed', pass: true },
    { name:'Entropy Check', desc:'No substring > 20 chars exceeds 4.5 bits/char Shannon entropy', pass: true },
    { name:'HMAC Signature', desc:'Payload signed with HMAC-SHA256; signature verified at AI analysis entry', pass: gr.passed },
  ];
  return `<div class="mb-2 section-title">Gate Checks</div>
    ${checks.map(c => `
      <div class="gate-check">
        <div class="gate-check-icon">${c.pass ? '✅':'❌'}</div>
        <div>
          <div class="gate-check-name">${esc(c.name)}</div>
          <div class="gate-check-desc">${esc(c.desc)}</div>
        </div>
        <span class="badge ${c.pass ? 'badge-emerald':'badge-red'}" style="margin-left:auto">${c.pass ? 'Pass':'Fail'}</span>
      </div>`).join('')}`;
}

function buildWorkflowPanel(detail, id) {
  const states = ['Draft','InReview','RemediationRequested','RemediationInProgress','Verified','Accepted'];
  const current = detail.workflow_status || 'Draft';
  const idx = states.indexOf(current);
  const nodes = states.map((s, i) => {
    let cls = 'wf-circle';
    if (i < idx) cls += ' wf-done';
    else if (i === idx) cls += ' wf-active';
    const icon = i < idx ? '✓' : i === idx ? '●' : '○';
    return `<div class="wf-node">
      <div class="${cls}" title="${esc(s)}">${icon}</div>
      <div class="wf-label">${esc(s)}</div>
    </div>${i < states.length-1 ? '<div class="wf-arrow">→</div>' : ''}`;
  }).join('');

  const transitions = {
    Draft: [['InReview', 'Submit for Review', 'btn-primary']],
    InReview: [['RemediationRequested','Request Remediation','btn-secondary'],['Verified','Mark Verified','btn-primary'],['Escalated','Escalate','btn-danger']],
    RemediationRequested: [['RemediationInProgress','Start Remediation','btn-secondary']],
    RemediationInProgress: [['Verified','Mark Verified','btn-primary']],
    Verified: [['Accepted','Accept','btn-primary'],['Rejected','Reject','btn-danger']],
    Escalated: [['Accepted','Accept','btn-primary'],['Rejected','Reject','btn-danger']],
  };
  const buttons = (transitions[current] || []).map(([to, label, cls]) =>
    `<button class="btn ${cls} btn-sm" onclick="transitionAssessment('${esc(id)}','${esc(to)}')">${esc(label)}</button>`
  ).join('');

  return `
    <p class="text-sm text-muted mb-4">Current state: ${statusBadge(current)}</p>
    <div class="workflow-track mb-4">${nodes}</div>
    ${buttons ? `<div class="flex gap-2 mt-4">${buttons}</div>` : ''}
    <div class="alert alert-navy mt-4">
      <span class="alert-icon">ℹ</span>
      <span>Frontend workflow controls are for review management only. Security enforcement — sanitization, gate checks, and signature verification — is performed by the backend pipeline and cannot be bypassed via the UI.</span>
    </div>
    <div class="alert alert-amber mt-2">
      <span class="alert-icon">⚠</span>
      <span>High and Critical findings require the approver to be different from the assessment creator (enforced by the backend).</span>
    </div>
  `;
}

async function transitionAssessment(id, to) {
  try {
    await api(`/assessments/${id}/transition`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ to_status: to, actor_id: 'reviewer', reason: `Transitioned to ${to} via UI` }),
    });
    toast(`Assessment moved to ${to}`, 'success');
    await openAssessmentDetail(id);
  } catch(e) {
    toast(e.message, 'error');
  }
}

function switchTab(tabEl, panelId) {
  const parent = tabEl.closest('.card') || document.body;
  parent.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  parent.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  tabEl.classList.add('active');
  document.getElementById(panelId)?.classList.add('active');
}

</script>

<script>
// ═══════════════════════════════════════════════════════════════════
//  SCREEN 3 — UPLOAD / NEW ASSESSMENT
// ═══════════════════════════════════════════════════════════════════
function renderUpload(el) {
  const STEPS = [
    { key:'ingestion',   label:'Reading & parsing pages' },
    { key:'pii',         label:'Detecting sensitive data (PII)' },
    { key:'nlp',         label:'Understanding document context' },
    { key:'policy',      label:'Classifying sensitivity levels' },
    { key:'sanitize',    label:'Sanitizing & vaulting PII' },
    { key:'gate',        label:'Security Gate verification' },
    { key:'ai_analysis', label:'AI risk analysis (Ollama)' },
    { key:'risk_engine', label:'Scoring and normalizing findings' },
    { key:'onetrust',    label:'OneTrust outbox dispatch' },
  ];
  el.innerHTML = `
    <div class="page-title mb-1">New Assessment</div>
    <div class="page-sub mb-4">Upload a vendor-provided document. All PII is detected and sanitized before any AI analysis.</div>

    <div style="display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start" id="upload-grid">
      <!-- Upload panel -->
      <div>
        <div class="card">
          <div class="card-header"><div class="card-title">📄 Upload Document</div></div>
          <div class="card-body">
            <div class="drop-zone" id="dz">
              <input type="file" id="upload-fi" accept=".pdf,.docx,.xlsx" aria-label="Upload vendor document">
              <div class="drop-zone-icon">📁</div>
              <div class="drop-zone-text">Drop file here or <span>click to browse</span></div>
              <div class="drop-zone-hint">PDF, Word (.docx), or Excel (.xlsx) · Max 50 MB</div>
              <div class="drop-zone-file" id="upload-fn"></div>
            </div>
            <div class="form-group mt-3">
              <label class="form-label" for="upload-vid">Vendor name</label>
              <input id="upload-vid" class="form-input" type="text" placeholder="e.g. Acme Cloud Services" aria-required="true">
              <div class="form-hint">Identifies the vendor in the assessment record</div>
            </div>
            <div id="upload-err"></div>
            <button class="btn btn-primary btn-full mt-3" id="upload-btn" disabled onclick="runUpload()" aria-label="Start assessment">
              <span id="upload-btn-icon">🔍</span>
              <span id="upload-btn-text">Start Assessment</span>
            </button>
          </div>
          <div class="card-footer">
            Raw PII never leaves the private zone. Only sanitized, gate-approved data reaches AI analysis.
          </div>
        </div>

        <!-- Pipeline steps -->
        <div class="card mt-3" id="upload-progress" style="display:none">
          <div class="card-header"><div class="card-title">Pipeline Progress</div></div>
          <div class="card-body">
            <div class="pipeline-steps" id="upload-steps">
              ${STEPS.map(s => `
                <div class="pipe-step" id="ps-${s.key}">
                  <div class="ps-dot"></div>
                  <div class="ps-label">${esc(s.label)}</div>
                  <div class="ps-time" id="ps-t-${s.key}"></div>
                </div>`).join('')}
            </div>
          </div>
        </div>
      </div>

      <!-- Results panel -->
      <div id="upload-result">
        <div class="card">
          <div class="empty-state">
            <div class="empty-icon">🛡</div>
            <div class="empty-title">Ready to assess</div>
            <div class="empty-desc">Upload a vendor document on the left. The pipeline will detect PII, sanitize it, run it through the Security Gate, and produce risk findings — all without raw data leaving the private zone.</div>
          </div>
        </div>
      </div>
    </div>
  `;

  // Wire drop zone
  const fi = document.getElementById('upload-fi');
  const dz = document.getElementById('dz');
  fi.addEventListener('change', () => fi.files[0] && pickFile(fi.files[0]));
  ['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); dz.classList.remove('over');
    if (ev === 'drop' && e.dataTransfer.files[0]) { fi.files = e.dataTransfer.files; pickFile(e.dataTransfer.files[0]); }
  }));

  function pickFile(f) {
    document.getElementById('upload-fn').textContent = '✓ ' + f.name;
    document.getElementById('upload-btn').disabled = false;
  }
}

async function runUpload() {
  const fi = document.getElementById('upload-fi');
  const vid = document.getElementById('upload-vid').value.trim() || 'Unknown Vendor';
  const file = fi.files[0];
  if (!file) return;

  const STEP_KEYS = ['ingestion','pii','nlp','policy','sanitize','gate','ai_analysis','risk_engine','onetrust'];
  let stepIdx = 0;
  let ticker;

  // Reset all steps
  STEP_KEYS.forEach(k => {
    document.getElementById(`ps-${k}`)?.classList.remove('ps-done','ps-active');
    const t = document.getElementById(`ps-t-${k}`); if (t) t.textContent = '';
  });

  document.getElementById('upload-progress').style.display = '';
  document.getElementById('upload-btn').disabled = true;
  document.getElementById('upload-btn-icon').innerHTML = '<span class="spin"></span>';
  document.getElementById('upload-btn-text').textContent = 'Processing…';
  document.getElementById('upload-err').innerHTML = '';

  function advance() {
    if (stepIdx > 0) document.getElementById(`ps-${STEP_KEYS[stepIdx-1]}`)?.classList.replace('ps-active','ps-done');
    if (stepIdx < STEP_KEYS.length) document.getElementById(`ps-${STEP_KEYS[stepIdx]}`)?.classList.add('ps-active');
    stepIdx++;
  }
  ticker = setInterval(advance, 1500);

  const fd = new FormData();
  fd.append('file', file);
  fd.append('vendor_id', vid);

  try {
    const r = await fetch('/api/v1/assessments', { method:'POST', headers:{'X-API-Key':API_KEY}, body:fd });
    clearInterval(ticker);
    if (!r.ok) {
      const err = await r.json().catch(() => ({ error: r.statusText }));
      throw new Error(err.detail || err.error || 'Assessment failed');
    }
    const sum = await r.json();
    const [detail, findings] = await Promise.all([
      api(`/assessments/${sum.assessment_id}`),
      api(`/assessments/${sum.assessment_id}/findings`),
    ]);

    // Mark all steps done with timings
    const timings = detail.stage_timings || {};
    STEP_KEYS.forEach(k => {
      const el = document.getElementById(`ps-${k}`);
      el?.classList.remove('ps-active'); el?.classList.add('ps-done');
      const ms = timings[k] ? Math.round(timings[k] * 1000) : null;
      const t = document.getElementById(`ps-t-${k}`); if (t && ms) t.textContent = ms + 'ms';
    });

    toast(`Assessment complete — ${findings.length} finding${findings.length !== 1 ? 's' : ''} generated`, 'success');
    renderUploadResults(sum, detail, findings);
  } catch(e) {
    clearInterval(ticker);
    toast(e.message, 'error');
    document.getElementById('upload-err').innerHTML = `
      <div class="alert alert-red mt-2">
        <span class="alert-icon">✗</span>
        <span>${esc(e.message)}</span>
      </div>`;
  } finally {
    document.getElementById('upload-btn').disabled = false;
    document.getElementById('upload-btn-icon').textContent = '🔍';
    document.getElementById('upload-btn-text').textContent = 'Start Assessment';
  }
}

function renderUploadResults(sum, detail, findings) {
  const gr = detail.gate_report || {};
  const critN = findings.filter(f => f.severity === 'Critical').length;
  const highN  = findings.filter(f => f.severity === 'High').length;
  const medN   = findings.filter(f => f.severity === 'Medium').length;
  const lowN   = findings.filter(f => f.severity === 'Low').length;
  const top    = findings[0]?.score ?? 0;

  const cards = findings.sort((a,b) => b.score - a.score).map((f,i) => buildFindingCard(f, `up-${i}`)).join('') ||
    `<div class="empty-state" style="min-height:100px"><div class="empty-icon" style="font-size:28px">✅</div><div class="empty-title">No issues found</div></div>`;

  document.getElementById('upload-result').innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="flex-1">
          <div class="card-title">📄 ${esc(detail.filename)}</div>
          <div class="card-sub">Vendor: <strong>${esc(detail.vendor_id)}</strong></div>
        </div>
        <div class="flex gap-2">
          ${sensitivityBadge(detail.sensitivity)}
          <span class="badge ${gr.passed ? 'badge-emerald':'badge-red'}">${gr.passed ? '⬡ Gate Passed':'⬡ Quarantined'}</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;padding:16px 20px;border-bottom:1px solid var(--border)">
        <div class="stat-card" style="padding:12px 14px">
          <div class="stat-label">Sensitivity</div>
          <div class="stat-value" style="font-size:16px">${esc(detail.sensitivity)}</div>
        </div>
        <div class="stat-card ${critN+highN > 0 ? 'accent-red':''}" style="padding:12px 14px">
          <div class="stat-label">Critical/High</div>
          <div class="stat-value" style="font-size:16px">${critN+highN}</div>
        </div>
        <div class="stat-card ${medN > 0 ? 'accent-amber':''}" style="padding:12px 14px">
          <div class="stat-label">Medium</div>
          <div class="stat-value" style="font-size:16px">${medN}</div>
        </div>
        <div class="stat-card" style="padding:12px 14px">
          <div class="stat-label">Low</div>
          <div class="stat-value" style="font-size:16px">${lowN}</div>
        </div>
        <div class="stat-card ${top > 50 ? 'accent-red' : top > 25 ? 'accent-amber':''}" style="padding:12px 14px">
          <div class="stat-label">Top Score</div>
          <div class="stat-value" style="font-size:16px">${top}<span style="font-size:10px;font-weight:400"> /100</span></div>
        </div>
      </div>
      <div class="tabs-bar" style="padding:0 20px">
        <div class="tab-item active" onclick="switchTab(this,'ur-findings')">Findings (${findings.length})</div>
        <div class="tab-item" onclick="switchTab(this,'ur-privacy')">Privacy Report</div>
        <div class="tab-item" onclick="switchTab(this,'ur-timing')">Timings</div>
      </div>
      <div style="padding:16px 20px">
        <div class="tab-panel active" id="ur-findings">${cards}</div>
        <div class="tab-panel" id="ur-privacy">
          ${buildPrivacyReport(gr)}
        </div>
        <div class="tab-panel" id="ur-timing">
          ${buildTimingBars(detail.stage_timings || {})}
        </div>
      </div>
      <div class="card-footer">
        <button class="btn btn-secondary btn-sm" onclick="goto('assessments')">View all assessments →</button>
      </div>
    </div>
  `;
}

function buildPrivacyReport(gr) {
  return `
    <div class="alert alert-green mb-4">
      <span class="alert-icon">✅</span>
      <span>This report contains <strong>no raw personal data</strong>. All PII detected in the original document was sanitized (redacted, tokenized, or generalized) before analysis. The values stored in the encrypted vault are never exposed in this view.</span>
    </div>
    <div class="stat-grid mb-4" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="stat-card accent-emerald" style="padding:12px 14px">
        <div class="stat-label">Gate Outcome</div>
        <div class="stat-value" style="font-size:15px">${gr.passed ? '✓ Passed' : '✗ Blocked'}</div>
      </div>
      <div class="stat-card" style="padding:12px 14px">
        <div class="stat-label">Blocks Processed</div>
        <div class="stat-value" style="font-size:15px">${gr.total_blocks || 0}</div>
      </div>
      <div class="stat-card accent-emerald" style="padding:12px 14px">
        <div class="stat-label">PII Leaked to AI</div>
        <div class="stat-value" style="font-size:15px">None</div>
      </div>
      <div class="stat-card accent-emerald" style="padding:12px 14px">
        <div class="stat-label">Raw PII in Report</div>
        <div class="stat-value" style="font-size:15px">None</div>
      </div>
    </div>
    <div class="gate-boundary">
      <div class="gate-boundary-title">How your data was protected</div>
      <div style="font-size:12px;color:rgba(255,255,255,.7);line-height:1.7">
        Every piece of sensitive information was detected and masked before AI analysis. Names, emails, phone numbers, API keys, and other personal or sensitive data were replaced with tokens (e.g. <code style="background:rgba(255,255,255,.1);padding:1px 5px;border-radius:3px">&lt;&lt;EMAIL_a3f7b2c1&gt;&gt;</code>) or redacted as <code style="background:rgba(255,255,255,.1);padding:1px 5px;border-radius:3px">[REDACTED:EMAIL_ADDRESS]</code>.<br><br>
        The Security Gate independently verified — using a separate Presidio instance — that no PII remained in the sanitized output before signing the payload. Only the signed, gate-approved document was seen by the AI risk analysis stage.
      </div>
    </div>
  `;
}

function buildTimingBars(timings) {
  const entries = Object.entries(timings);
  if (!entries.length) return `<div class="empty-state" style="min-height:80px"><div class="empty-desc">No timing data available.</div></div>`;
  const maxMs = Math.max(...entries.map(([,v]) => v * 1000), 1);
  return `<p class="text-sm text-muted mb-3">Wall-clock time per pipeline stage</p>
    ${entries.map(([k,v]) => {
      const ms = Math.round(v * 1000), pct = Math.max(2, Math.round(ms / maxMs * 100));
      return `<div class="timing-row">
        <div class="timing-label">${esc(k.replace(/_/g,' '))}</div>
        <div class="timing-track"><div class="timing-fill" style="width:${pct}%"></div></div>
        <div class="timing-ms">${ms}ms</div>
      </div>`;
    }).join('')}`;
}

</script>

<script>
// ═══════════════════════════════════════════════════════════════════
//  FINDING CARD BUILDER (shared)
// ═══════════════════════════════════════════════════════════════════
function buildFindingCard(f, uid) {
  const etypes = (f.entity_types_found || []);
  const PRIO = ['API_KEY','PEM_PRIVATE_KEY','CREDENTIAL_URL','US_SSN','CREDIT_CARD','IBAN_CODE','BANK_ACCOUNT','EMAIL_ADDRESS','PHONE_NUMBER','PERSON','IP_ADDRESS','INTERNAL_HOSTNAME','EMPLOYEE_ID','DATE_OF_BIRTH','CONTRACT_NUMBER','MAC_ADDRESS'];
  const sorted = [...etypes].sort((a,b) => { const ai=PRIO.indexOf(a),bi=PRIO.indexOf(b); return (ai<0?99:ai)-(bi<0?99:bi); });

  const chips = sorted.slice(0,3).map(entityChip).join('');
  const more  = sorted.length > 3 ? `<span class="text-xs text-muted">+${sorted.length-3} more</span>` : '';
  const loc   = f.section_label ? `<div class="finding-location">📍 ${esc(f.section_label)}</div>` : '';

  const desc = f.description || '';
  const sentRx = /[^.!?]+[.!?]+/g;
  const sents = (desc.match(sentRx) || [desc]).map(s => s.trim()).filter(Boolean);
  const s1 = sents[0] || '';
  const why = sents.length > 2 ? sents.slice(1,-1).join(' ').trim() : sents.slice(1).join(' ').trim();
  const last = sents[sents.length - 1] || '';
  const isAction = /^(Ask|Escalate|Notify|Report|Rotate)/i.test(last);
  const action = isAction ? last : (f.recommendation || '');
  const whyFull = why || (!isAction ? last : '');
  const preview = (whyFull || s1).slice(0,120) + ((whyFull || s1).length > 120 ? '…' : '');

  const ctls = (f.controls || []).slice(0,4);
  const statusHtml = f.status && f.status !== 'Draft'
    ? `<span class="badge badge-blue" style="margin-bottom:4px">${esc(f.status)}</span>`
    : '';

  return `
    <div class="finding-card sev-${esc(f.severity)}">
      <div class="finding-card-top" onclick="toggleFinding('${uid}')" aria-expanded="false" aria-controls="fd-${uid}">
        <div class="finding-stripe" aria-hidden="true"></div>
        <div class="finding-body">
          ${loc}
          ${chips || more ? `<div class="finding-chips">${chips}${more}</div>` : ''}
          <div class="finding-title">${esc(f.title)}</div>
          <div class="finding-desc">${esc(preview)}</div>
        </div>
        <div class="finding-right">
          <div class="score-ring sr-${esc(f.severity)}" aria-label="Risk score ${f.score}">
            ${f.score}<div style="font-size:8px;font-weight:400;color:var(--text-muted)">/100</div>
          </div>
          ${sevBadge(f.severity)}
          ${statusHtml}
          <div class="finding-chevron" id="fc-${uid}" aria-hidden="true">▼</div>
        </div>
      </div>
      <div class="finding-detail" id="fd-${uid}" role="region">
        ${s1 ? `<div class="detail-section">
          <div class="detail-label">What was found</div>
          <div class="detail-found-box">
            ${chips ? `<div class="finding-chips" style="margin-bottom:6px">${sorted.slice(0,4).map(entityChip).join('')}</div>` : ''}
            ${esc(s1)}
          </div>
        </div>` : ''}
        ${whyFull ? `<div class="detail-section">
          <div class="detail-label">Why this matters</div>
          <div class="detail-why-box">${esc(whyFull)}</div>
        </div>` : ''}
        ${action ? `<div class="detail-section">
          <div class="detail-label">Recommended action</div>
          <div class="detail-action-box"><span>✉</span><span>${esc(action)}</span></div>
        </div>` : ''}
        ${ctls.length ? `<div class="detail-section">
          <div class="detail-label">Applicable controls</div>
          <div class="control-chips">${ctls.map(c => `<span class="control-chip">${esc(c.framework)} — ${esc(c.name || c.ref)}</span>`).join('')}</div>
        </div>` : ''}
        <div class="detail-section">
          <div class="detail-label">Risk category</div>
          <span class="badge badge-purple">${esc(f.risk_category)}</span>
          <span class="badge badge-navy" style="margin-left:4px">Score ${f.score}/100</span>
        </div>
      </div>
    </div>`;
}

function toggleFinding(uid) {
  const det = document.getElementById(`fd-${uid}`);
  const chev = document.getElementById(`fc-${uid}`);
  det?.classList.toggle('open');
  chev?.classList.toggle('open');
}

// ═══════════════════════════════════════════════════════════════════
//  SCREEN 4 — SECURITY GATE
// ═══════════════════════════════════════════════════════════════════
async function renderGate(el) {
  const decisions = await api('/gate/decisions').catch(() => []);
  state.gateDecisions = decisions;

  const approved   = decisions.filter(d => d.outcome === 'approved').length;
  const quarantined = decisions.filter(d => d.outcome === 'quarantined').length;
  const totalBlocks = decisions.reduce((s,d) => s + (d.total_blocks||0), 0);
  const rescanHits  = decisions.reduce((s,d) => s + (d.rescan_hits||0), 0);

  const rows = decisions.map(d => `
    <tr>
      <td>
        <div class="font-bold truncate" style="max-width:160px">${esc(d.vendor_id || '—')}</div>
        <div class="td-muted truncate" style="max-width:160px">${esc(d.filename || '—')}</div>
      </td>
      <td>
        <span class="badge ${d.outcome === 'approved' ? 'badge-emerald':'badge-red'}">
          ${d.outcome === 'approved' ? '⬡ Approved' : '⛔ Quarantined'}
        </span>
      </td>
      <td class="td-muted">${d.total_blocks || 0}</td>
      <td class="td-muted">${d.sensitive_path_blocks || 0}</td>
      <td>
        ${d.rescan_hits > 0 ? `<span class="badge badge-red">${d.rescan_hits} hit${d.rescan_hits>1?'s':''}</span>` : '<span class="badge badge-green">Clean</span>'}
      </td>
      <td class="td-muted">${fmtDateTime(d.ts)}</td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick="showGateDetail(${esc(JSON.stringify(d).replace(/"/g,'&quot;'))})">Details</button>
      </td>
    </tr>`).join('') || `<tr><td colspan="7"><div class="empty-state" style="min-height:100px"><div class="empty-icon" style="font-size:28px">⬡</div><div class="empty-desc">No gate decisions yet. Submit an assessment to see results here.</div></div></td></tr>`;

  el.innerHTML = `
    <div class="page-title mb-1">Security Gate</div>
    <div class="page-sub mb-4">The only crossing point between the private/trusted zone and the AI analysis zone</div>

    <!-- Architecture overview -->
    <div class="gate-boundary mb-6">
      <div class="gate-boundary-title">⬡ Trust Boundary Architecture</div>
      <div style="display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr;gap:0;align-items:stretch">
        <div class="gate-zone gate-zone-private">
          <div class="gate-zone-label zone-private-label">🔒 Private / Trusted Zone</div>
          <div style="font-size:11px;color:rgba(255,255,255,.7);line-height:1.6">
            • Document Ingestion<br>
            • PII Detection (Presidio)<br>
            • Local NLP (spaCy + embeddings)<br>
            • Policy Engine<br>
            • Sensitivity Scoring<br>
            • Sanitization + Vault
          </div>
          <div style="margin-top:8px;font-size:10px;color:rgba(255,255,255,.4)">Docker internal-only network · No egress</div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;color:#fbbf24;font-size:22px">→</div>
        <div class="gate-zone gate-zone-gate">
          <div class="gate-zone-label zone-gate-label">⬡ Security Gate — sole crossing point</div>
          <div style="font-size:11px;color:rgba(255,255,255,.7);line-height:1.8">
            1. PII Re-scan (independent Presidio)<br>
            2. Vault lookup — no raw value verbatim<br>
            3. Token grammar validation<br>
            4. Entropy check (>4.5 bits/char)<br>
            5. HMAC-SHA256 signing
          </div>
          <div style="margin-top:8px;font-size:10px;color:rgba(255,255,255,.4)">Fail-closed · Any failure → quarantine</div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;color:#93c5fd;font-size:22px">→</div>
        <div class="gate-zone gate-zone-ai">
          <div class="gate-zone-label zone-ai-label">🤖 AI / Public Zone</div>
          <div style="font-size:11px;color:rgba(255,255,255,.7);line-height:1.6">
            • AI Risk Analysis (Ollama)<br>
            • Risk Engine<br>
            • Workflow State Machine<br>
            • OneTrust Outbox
          </div>
          <div style="margin-top:8px;font-size:10px;color:rgba(255,255,255,.4)">Never sees raw PII · Only GateApprovedPayload</div>
        </div>
      </div>
      <div class="hmac-note" style="background:rgba(217,119,6,.15);border-color:rgba(217,119,6,.4);color:#fbbf24;margin-top:12px">
        ⚠ HMAC signature validity confirms integrity and authenticity under the configured signing key. It does not independently verify absence of PII — that is enforced by re-scan, vault lookup, and entropy checks.
      </div>
    </div>

    <!-- Stats -->
    <div class="stat-grid mb-6">
      <div class="stat-card accent-emerald">
        <div class="stat-label">Payloads Approved</div>
        <div class="stat-value">${approved}</div>
        <div class="stat-hint">✓ Cleared all gate checks</div>
      </div>
      <div class="stat-card ${quarantined > 0 ? 'accent-red':''}">
        <div class="stat-label">Quarantined</div>
        <div class="stat-value">${quarantined}</div>
        <div class="stat-hint">${quarantined > 0 ? '🚫 Blocked before AI zone' : '✓ No violations'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Blocks Processed</div>
        <div class="stat-value">${totalBlocks}</div>
        <div class="stat-hint">Across all assessments</div>
      </div>
      <div class="stat-card ${rescanHits > 0 ? 'accent-amber':'accent-green'}">
        <div class="stat-label">Re-scan Hits</div>
        <div class="stat-value">${rescanHits}</div>
        <div class="stat-hint">${rescanHits > 0 ? 'PII found in re-scan → re-sanitized' : '✓ No residual PII detected'}</div>
      </div>
    </div>

    <!-- Gate decisions table -->
    <div class="card">
      <div class="card-header">
        <div class="flex-1">
          <div class="card-title">Gate Decisions</div>
          <div class="card-sub">Chronological record of all Security Gate outcomes</div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Vendor / File</th><th>Outcome</th><th>Blocks</th><th>Sensitive</th><th>Re-scan</th><th>Time</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>

    <div id="gate-detail-panel" class="mt-4"></div>
  `;
}

function showGateDetail(d) {

    <div class="card">
      <div class="card-header">
        <div class="flex-1">
          <div class="card-title">⬡ Gate Decision Detail</div>
          <div class="card-sub">${esc(d.vendor_id || '—')} · ${esc(d.filename || '—')}</div>
        </div>
        <span class="badge ${d.outcome === 'approved' ? 'badge-emerald badge-lg':'badge-red badge-lg'}">${d.outcome === 'approved' ? '⬡ Gate Approved':'⛔ Quarantined'}</span>
      </div>
      <div class="card-body">
        <div class="stat-grid mb-4" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">
          <div class="stat-card" style="padding:12px"><div class="stat-label">Total Blocks</div><div class="stat-value" style="font-size:18px">${d.total_blocks||0}</div></div>
          <div class="stat-card" style="padding:12px"><div class="stat-label">Safe Path</div><div class="stat-value" style="font-size:18px">${d.safe_path_blocks||0}</div></div>
          <div class="stat-card" style="padding:12px"><div class="stat-label">Sensitive Path</div><div class="stat-value" style="font-size:18px">${d.sensitive_path_blocks||0}</div></div>
          <div class="stat-card ${d.rescan_hits > 0 ? 'accent-red':''}" style="padding:12px"><div class="stat-label">Re-scan Hits</div><div class="stat-value" style="font-size:18px">${d.rescan_hits||0}</div></div>
          <div class="stat-card" style="padding:12px"><div class="stat-label">Re-routed</div><div class="stat-value" style="font-size:18px">${d.rerouted_blocks||0}</div></div>
